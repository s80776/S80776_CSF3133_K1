<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        /* Header Section */
        #header {
            background-color: #356859;
            color: white;
            text-align: center;
            padding: 25px;
        }

        #header h1 {
            margin-bottom: 10px;
        }

        #header span {
            color: #d9ead3;
            font-style: italic;
        }

        /* Content Section */
        #content {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
        }

        .contact-form, .calculator {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #356859;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="range"] {
            padding: 0;
        }

        button {
            background-color: #356859;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #244b3e;
        }

        output {
            font-weight: bold;
            color: #356859;
        }

        /* Footer Section */
        #footer {
            background-color: #356859;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <div id="header">

        <h1>Contact Us</h1>

        <span>We are happy to hear from you!</span>

    </div>


    <!-- Content Section -->
    <div id="content">

        <!-- Contact Form -->
        <div class="contact-form">

            <h2>Contact Form</h2>

            <p>
                Please fill in the form below to
                <strong>contact us</strong>.
            </p>

            <form onsubmit="submitForm(event)">

                <!-- Email Input -->
                <label for="email">Email Address:</label>
                <input type="email" id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <!-- Date Input -->
                <label for="date">Preferred Contact Date:</label>
                <input type="date" id="date"
                       name="date"
                       required>

                <!-- Range Input -->
                <label for="satisfaction">
                    Satisfaction Level:
                    <output id="rangeValue">5</output>
                </label>

                <input type="range"
                       id="satisfaction"
                       name="satisfaction"
                       min="1"
                       max="10"
                       step="1"
                       value="5"
                       oninput="rangeValue.textContent = this.value">

                <!-- Submit Button -->
                <button type="submit">Submit</button>

            </form>

        </div>


        <!-- Inline Calculator -->
        <div class="calculator">

            <h2>Simple Calculator</h2>

            <p>Enter two numbers to calculate their sum.</p>

            <!-- First Number -->
            <label for="num1">First Number:</label>
            <input type="number"
                   id="num1"
                   placeholder="Enter first number">

            <!-- Second Number -->
            <label for="num2">Second Number:</label>
            <input type="number"
                   id="num2"
                   placeholder="Enter second number">

            <!-- Output Element -->
            <p>
                Sum:
                <output id="result">0</output>
            </p>

        </div>

    </div>


    <!-- Footer Section -->
    <div id="footer">

        <p>Contact us: example@email.com</p>

        <p>&copy; 2026 Contact Us. All Rights Reserved.</p>

    </div>


    <script>

        // Inline Calculator
        const number1 = document.getElementById("num1");
        const number2 = document.getElementById("num2");
        const result = document.getElementById("result");

        function calculateSum() {

            let num1 = number1.value;
            let num2 = number2.value;

            if (num1 === "" || num2 === "") {
                result.textContent = "0";
            } else {
                result.textContent =
                    Number(num1) + Number(num2);
            }

        }

        number1.addEventListener("input", calculateSum);
        number2.addEventListener("input", calculateSum);


        // Contact Form Submission
        function submitForm(event) {

            event.preventDefault();

            alert("Your contact form has been submitted successfully!");

        }

    </script>

</body>
</html>
