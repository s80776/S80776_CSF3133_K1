
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact Us</title>
    <meta charset="UTF-8">
</head>

<body>
    <!-- Header Section -->
    <div id="header">

        <h1>Contact Us</h1>

        <span>Welcome! We are happy to hear from you.</span>
    </div>


    <!-- Content Section -->
    <div id="content">
        <!-- Contact Form -->
        <div>
            <h2>Contact Form</h2>

            <p>Please fill in the form below.</p>

            <form onsubmit="submitForm(event)">

                <!-- Email Input -->
                <label for="email">Email Address:</label>
                <input type="email" id="email"
                       name="email" required>
                <br><br>

                <!-- Date Input -->
                <label for="date">Preferred Contact Date:</label>
                <input type="date" id="date"
                       name="date" required>
                <br><br>

                <!-- Range Slider -->
                <label for="satisfaction">
                    Satisfaction Level:
                </label>

                <input type="range"
                       id="satisfaction"
                       name="satisfaction"
                       min="1"
                       max="10"
                       step="1"
                       value="5"
                       oninput="rangeValue.value = this.value">
                <output id="rangeValue">5</output>
                <br><br>

                <!-- Submit Button -->
                <input type="submit" value="Submit">
            </form>
        </div>
        <hr>


        <!-- Inline Calculator -->
        <div>
            <h2>Simple Calculator</h2>

            <p>Enter two numbers to calculate their sum.</p>

            <form oninput="calculateSum()">

                <!-- First Number -->
                <label for="num1">First Number:</label>
                <input type="number"
                       id="num1"
                       name="num1">
                <br><br>

                <!-- Second Number -->
                <label for="num2">Second Number:</label>
                <input type="number"
                       id="num2"
                       name="num2">
                <br><br>

                <!-- Display Result -->
                Sum:
                <output id="result" name="result">0</output>
            </form>
        </div>
    </div>


    <!-- Footer Section -->
    <div id="footer">
        <hr>
        <p>Contact us: contact@email.com</p>

        <p>&copy; 2026 Contact Us. All Rights Reserved.</p>
    </div>


    <script>
        // Calculator Function
        function calculateSum() {

            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;

            if (num1 === "" || num2 === "") {
                document.getElementById("result").value = 0;
            } else {
                let sum = Number(num1) + Number(num2);
                document.getElementById("result").value = sum;
            }
        }

        // Contact Form Submission
        function submitForm(event) {
            event.preventDefault();
            alert("Your contact form has been submitted successfully!");
        }
    </script>
</body>
</html>
