<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main page heading -->
    <header>
        <h1>Student Grade Calculator</h1>
        <p>Enter your name and mark to check your grade.</p>
    </header>

    <!-- Form for student details -->
    <main>
        <section class="calculator">
            <form name="gradeForm" onsubmit="return checkMark(event)">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">

                <label for="mark">Mark (0-100):</label>
                <input type="text" id="mark" name="mark" placeholder="Enter your mark">

                <div class="button-group">
                    <button type="submit">Check Grade</button>
                    <button type="button" onclick="randomMark()">Random Mark</button>
                </div>
            </form>

            <!-- Display the grade result and checking date/time -->
            <p id="result"></p>
            <p id="checkedTime"></p>

            <!-- Button and container for the grade reference table -->
            <button type="button" onclick="showTable()">Show Grade Table</button>
            <div id="tableContainer"></div>
        </section>
    </main>

    <!-- Load the external JavaScript file -->
    <script src="grade.js"></script>
</body>
</html>
