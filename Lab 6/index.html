
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Quiz Application</h1>
        <p>Test Your Knowledge!</p>
    </header>

    <section class="quiz-container">

        <button id="startButton" onclick="startQuiz()">Start Quiz</button>

        <div id="quizSection" style="display: none;">

            <div class="quiz-info">
                <p id="questionNumber"></p>
                <p>Time Left: <span id="timer">15</span> seconds</p>
            </div>

            <h2 id="question"></h2>

            <div id="options"></div>

            <div id="feedback"></div>

            <button id="submitButton" onclick="checkAnswer()">Submit Answer</button>

            <button id="nextButton" onclick="nextQuestion()" style="display: none;">
                Next Question
            </button>

        </div>

    </section>

    <footer id="result">
        <p>Your score will appear here after finishing the quiz.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
